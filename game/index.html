<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an original open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f08; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Heat: explore Solmar Bay on foot and by car, complete six missions, and escape the police"></canvas>
<p id="status" role="status" aria-live="polite">Solmar Heat loading</p>
<script type="module">
  import { boot } from './src/game.js';
  boot();
</script>
</body>
</html>
